<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Riftbound Deck Builder</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101315" />
    <meta
      name="description"
      content="Build and save Riftbound decks. Search the card catalog, check your list, compare energy costs and export a backup."
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        document.documentElement.dataset.mode = localStorage.getItem('riftbound-theme') || 'dark';
      } catch {
        document.documentElement.dataset.mode = 'dark';
      }
    </script>
  </head>
  <body>
    <app-root></app-root
    ><noscript
      ><p>
        This deck builder needs JavaScript. You can also browse the
        <a href="https://playriftbound.com/en-us/card-gallery/">official Riftbound card gallery</a>.
      </p></noscript
    >
  </body>
</html>
