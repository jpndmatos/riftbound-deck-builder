<a class="skip-link" href="#workspace" (click)="focusWorkspace($event)">Skip to workspace</a>
<header class="app-header">
  <a class="brand" routerLink="/builder" aria-label="Riftbound deck builder"
    ><app-icon name="cards" /><span>Riftbound <span class="brand-sub">decks</span></span></a
  >
  <nav aria-label="Main navigation">
    <a routerLink="/builder" routerLinkActive="current">Builder</a
    ><a routerLink="/decks" routerLinkActive="current"
      >Saved decks <span class="nav-count">{{ store.saved().length }}</span></a
    >
  </nav>
  <div class="header-end"><span class="local-label">Saved on this device</span></div>
</header>
<main id="workspace" tabindex="-1"><router-outlet /></main>
@if (store.storageError()) {
  <div class="storage-warning" role="alert">{{ store.storageError() }}</div>
}
